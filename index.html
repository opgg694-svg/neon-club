<script>
function yc(m){var n=Date.now();if(yc.t&&n-yc.t<5000&&yc.m==m){yc.t=0;return true}yc.t=n;yc.m=m;try{toast(m+" Нажмите ещё раз, чтобы подтвердить",3500)}catch(e){}return false}

const $=s=>document.querySelector(s),KEY="respawn_empire_v1";
const T=[["Офисный ПК",25e3,1,"#8fb3d9"],["Игровой ПК",7e4,1.3,"#22d3ee"],["Про-станция",16e4,1.7,"#a24dff"],["VIP-кабина",38e4,2.3,"#ff4fd0"]];
// id, имя, тип, трафик, конкуренты, цена точки, аренда/день, клетка карты
const LC=[["park","парк","park",.7,1,6e5,1800,0],["mall","ТЦ","mall",1.4,0,16e5,5200,1],["school","школьный квартал","school",.8,0,45e4,1400,2],["biz","бизнес-центр","biz",1.1,2,11e5,3600,3],["uni","университет","uni",1.3,1,13e5,4000,5],["metro","у метро","metro",1,2,0,2400,6],["home","спальный район","home",.9,2,7e5,2000,8],["rail","вокзал","rail",1,2,9e5,2800,10]];

["Сломалась клавиатура, замена 4 000 ₽",1,1,-4e3],["Школьная экскурсия: пришла большая группа",1.18],["Интернет пропадал на пару часов, гости ушли",.82],["Сосед сверху залил потолок: ремонт 9 000 ₽",1,1,-9e3],
["Корпоратив: компания сняла часть зала, +12 000 ₽",1.05,1,12e3],["Розыгрыш в соцсетях: пришли подписчики",1.12],["Сломался кондиционер, в зале душно",.9],["Большой киберспортивный стрим в городе",1.25],
["Гость пролил энергетик на клавиатуру: 3 000 ₽",1,1,-3e3],["Ребята из соседнего вуза привели друзей",1.14],["Мигает свет, часть гостей ушла",.92],["Нашёл забытый кошелёк с наградой, +4 000 ₽",1,1,4e3],
["Гость оставил восторженный отзыв про клуб",1.06,1,0,3],["Гость написал злой отзыв про цены",.96,1,0,-3],["Блогер похвалил чистоту и вежливых админов",1.08,1,0,2],["Жалоба на грязь в зале попала в соцсети",.94,1,0,-3]];
const WX=[["☀️","Ясно",1],["⛅","Облачно",1.05],["🌧","Дождь",1.2],["⛈","Гроза",1.3],["❄️","Снег",1.15],["🔥","Жара",.85]],WDM=[.85,.9,.95,1,1.2,1.4,1.3];
const SEAS=[[.3,.25,.25,.05,0,.15],[.2,.25,.4,.1,0,.05],[.15,.25,.3,.05,.25,0],[.1,.2,.05,0,.65,0],[.1,.2,0,0,.7,0],[.15,.25,.05,0,.55,0],[.25,.35,.3,.05,.05,0],[.3,.3,.3,.05,.05,0],[.4,.3,.2,.05,0,.05],[.45,.2,.1,.05,0,.2],[.4,.15,.1,.05,0,.3],[.4,.2,.1,.1,0,.2]];
const pickWx=d=>{const w=SEAS[Math.floor((d-1)/30)%12];let r=Math.random(),i=0;for(;i<5&&r>w[i];i++)r-=w[i];return i};
const hol=d=>d%15==0,pay=d=>d%10==5,dmOf=(d,w)=>WDM[(d-1)%7]*WX[w][2]*(hol(d)?1.25:pay(d)?1.1:1);

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

 return null}
